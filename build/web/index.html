<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
    .card { border-radius: 20px; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-lg p-4">
        <h3 class="text-center mb-4"><i class="bi bi-person-circle"></i> My Personal Profile</h3>

        <form action="ProfileServlet" method="POST">
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-person"></i> Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-card-text"></i> Student ID</label>
            <input type="text" name="studentId" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-mortarboard"></i> Program</label>
            <input type="text" name="program" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label d-block"><i class="bi bi-heart"></i> Hobbies</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" name="hobbies" value="Reading" id="h1">
              <label class="form-check-label" for="h1">Reading</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" name="hobbies" value="Gaming" id="h2">
              <label class="form-check-label" for="h2">Gaming</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" name="hobbies" value="Sports" id="h3">
              <label class="form-check-label" for="h3">Sports</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" name="hobbies" value="Music" id="h4">
              <label class="form-check-label" for="h4">Music</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-chat-quote"></i> Short Self-Introduction</label>
            <textarea name="intro" rows="3" class="form-control"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send"></i> Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
